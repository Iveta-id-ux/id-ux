<title>Protected report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{--bg:220 18% 8%;--fg:210 20% 92%;--card:220 18% 11%;--muted:215 15% 55%;
        --border:220 15% 18%;--accent:175 70% 50%;--err:0 70% 60%;--radius:0.25rem;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:hsl(var(--bg));color:hsl(var(--fg));font-family:'Inter',system-ui,sans-serif;
    background-image:radial-gradient(60% 50% at 50% 0%,hsl(var(--accent) / .12),transparent 70%);}
  .lock{width:min(92vw,380px);background:hsl(var(--card));border:1px solid hsl(var(--border));
    border-radius:var(--radius);padding:2rem 1.75rem;text-align:center;}
  .ico{font-size:1.6rem}
  h1{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:500;margin:.6rem 0 .2rem;
    letter-spacing:-0.01em;}
  p{color:hsl(var(--muted));font-size:.85rem;margin:.2rem 0 1.3rem;}
  form{display:flex;flex-direction:column;gap:.7rem;}
  input{font-family:'JetBrains Mono',monospace;font-size:.95rem;padding:.65rem .8rem;
    background:hsl(var(--bg));color:hsl(var(--fg));border:1px solid hsl(var(--border));
    border-radius:var(--radius);outline:none;}
  input:focus{border-color:hsl(var(--accent) / .6);box-shadow:0 0 18px hsl(var(--accent) / .15);}
  button{font-family:'JetBrains Mono',monospace;font-size:.9rem;padding:.6rem .8rem;cursor:pointer;
    background:hsl(var(--accent) / .12);color:hsl(var(--accent));border:1px solid hsl(var(--accent) / .5);
    border-radius:var(--radius);transition:all .2s ease;}
  button:hover{background:hsl(var(--accent) / .2);}
  .err{color:hsl(var(--err));font-family:'JetBrains Mono',monospace;font-size:.78rem;
    min-height:1.1em;margin-top:.2rem;}
</style>
</head>

  async function unlock(pw){
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
